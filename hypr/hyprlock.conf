# ==========================================
# HYPRLOCK - CATPPUCCIN MOCHA & MINIMAL
# ==========================================

background {
    monitor =
    path = ~/.config/niri/wall.jpg   # Usa el mismo fondo de tu escritorio
    
    # Efecto de cristal esmerilado
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    
    # Colores Catppuccin Mocha
    outer_color = rgb(203, 166, 247) # Mauve (Morado)
    inner_color = rgb(30, 30, 46)    # Base (Gris oscuro)
    font_color = rgb(205, 214, 244)  # Text (Blanco suave)
    check_color = rgb(166, 227, 161) # Green (Al verificar contraseña)
    fail_color = rgb(243, 139, 168)  # Red (Si te equivocas)

    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(203, 166, 247) # Mauve
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, 80
    halign = center
    valign = center
}
