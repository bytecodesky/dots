# ==========================================
# CONFIGURACIÓN MINIMALISTA - CATPPUCCIN
# ==========================================

add_newline = true
# Activamos la paleta personalizada definida al final del archivo
palette = "catppuccin_mocha"

# Lado izquierdo: Usuario, Git, Lenguajes. 
# Luego hace un salto de línea limpio para que escribas.
format = """
$username\
$hostname\
$git_branch\
$git_status\
$all\
$line_break\
$character"""

# Lado derecho: El directorio pegado al borde derecho de la terminal
right_format = """$directory"""

# ==========================================
# MÓDULOS DEL SISTEMA
# ==========================================

# Muestra siempre tu usuario (color mauve / morado pastel)
[username]
show_always = true
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)"

# Muestra siempre el hostname (color texto claro)
[hostname]
ssh_only = false
style = "bold text"
format = "[@$hostname]($style) "

# Directorio a la derecha (color azul)
[directory]
style = "bold blue"
read_only = " "
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style)"

# Símbolo del prompt (Verde si todo va bien, Rojo si hay error)
[character]
success_symbol = "[󱞩](bold green)"
error_symbol = "[󱞩](bold red)"
vimcmd_symbol = "[󱞥](bold yellow)"

# ==========================================
# GIT (Colores Rosa y Granate)
# ==========================================

[git_branch]
symbol = " "
style = "italic pink"
format = "[$symbol$branch]($style) "

[git_status]
style = "italic maroon"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ==========================================
# LENGUAJES (Mapeados a colores Catppuccin)
# ==========================================

[nodejs]
symbol = " "
format = "[$symbol($version )](bold green)"

[docker_context]
symbol = "󰡨 "
format = "[$symbol($version )](bold blue)"

[python]
symbol = " "
format = "[$symbol($version )](bold yellow)"

[rust]
symbol = " "
format = "[$symbol($version )](bold peach)"

[golang]
symbol = " "
format = "[$symbol($version )](bold sky)"

[nix_shell]
symbol = " "
style = "bold italic sapphire"
format = "[$symbol nix]($style) "

[package]
disabled = true

# ==========================================
# PALETA DE COLORES OFICIAL CATPPUCCIN MOCHA
